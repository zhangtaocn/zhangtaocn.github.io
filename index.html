<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portfolio</title>
    <style>
        /* 基础重置与背景设置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* 鼠标跟随光晕效果 */
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 157, 0.15) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        /* 主内容卡片 */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(10px);
            padding: 3rem 4rem;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 头像样式 */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ff9d, #00b8ff);
            margin: 0 auto 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: #0d1117;
            font-weight: bold;
        }

        /* 文本排版 */
        h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #ffffff; }
        .typing-text { 
            color: #00ff9d; 
            font-size: 1.2rem; 
            min-height: 1.5em;
            margin-bottom: 1.5rem;
        }
        .cursor { animation: blink 1s step-end infinite; color: #00ff9d; }
        @keyframes blink { 50% { opacity: 0; } }

        p { font-size: 0.9rem; color: #8b949e; line-height: 1.6; margin-bottom: 2rem; }

        /* 链接按钮 */
        .links a {
            display: inline-block;
            margin: 0 0.5rem;
            padding: 0.6rem 1.5rem;
            border: 1px solid #00ff9d;
            color: #00ff9d;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .links a:hover {
            background-color: #00ff9d;
            color: #0d1117;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.5);
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            .card { padding: 2rem; margin: 1rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- 鼠标光晕层 -->
    <div class="cursor-glow" id="glow"></div>

    <!-- 核心内容区 -->
    <div class="card">
        <div class="avatar">Dev</div>
        <h1>Hello, I'm 张 涛</h1>
        <div class="typing-text">
            <span id="typewriter"></span><span class="cursor">|</span>
        </div>
        <p>
            热爱开源，专注于构建优雅、高性能的软件系统。<br>
            欢迎来到我的数字空间站。
        </p>
        <div class="links">
            <a href="https://github.com/your-username" target="_blank">GitHub</a>
            <a href="mailto:your@email.com">Contact</a>
        </div>
    </div>

    <script>
        // 1. 鼠标跟随光晕逻辑
        const glow = document.getElementById('glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // 2. 打字机效果逻辑
        const texts = [
            "System.out.println('Hello World');",
            "Building scalable microservices...",
            "Optimizing algorithms & UI/UX.",
            "git commit -m 'Deploy to GitHub Pages'"
        ];
        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typewriterEl = document.getElementById('typewriter');

        function type() {
            const currentText = texts[textIndex];
            
            if (isDeleting) {
                typewriterEl.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typewriterEl.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === currentText.length) {
                typeSpeed = 2000; // 停顿
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % texts.length;
                typeSpeed = 500;
            }

            setTimeout(type, typeSpeed);
        }
        type();
    </script>
</body>
</html>
